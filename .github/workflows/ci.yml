# CI/CD 流水线 — GitHub Actions
#
# 门禁等级（与 CLAUDE.md 一致）：
#   P0（提交前）→ dev-verify 模式 — dev 分支每次推送
#   P1（合入前）→ verify 模式   — master 分支 PR/推送
#   P2（发布前）→ verify,regression 模式 — 版本标签推送
#   guards      → 7 个 --ci 守护脚本（P0/P2 同源），阻塞；lint（ruff）非阻塞
#   portability → 非 UTF-8 locale + 隐式编码探针（PEP 597），阻塞

name: CI

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install --retries 5 --timeout 60 -e ".[test]"

      - name: P0 — 快速验证（dev 提交门禁）
        if: github.ref_name == 'dev' && github.event_name == 'push'
        run: python scripts/test-runner.py --mode dev-verify --no-timeout

      - name: P1 — 合入验证（master 门禁）
        if: github.ref_name == 'master' || github.event_name == 'pull_request'
        run: python scripts/test-runner.py --mode verify --no-timeout

      - name: P2 — 发布验证（版本发布门禁）
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/test-runner.py --mode verify,regression --no-timeout

      # 即使测试失败也上传报告，便于诊断失败测试（保留 7 天）
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: test-reports/latest/
          if-no-files-found: warn
          retention-days: 7

  format:
    runs-on: ubuntu-latest
    continue-on-error: true  # lint/格式问题不阻断 CI（非阻塞门禁，可后续修复）
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install --retries 5 --timeout 60 -e ".[test]"

      - name: Ruff 格式检查
        run: python -m ruff format --check src/python/ scripts/

      - name: Ruff Lint 检查
        run: python -m ruff check

  guards:
    # 7 个 --ci 守护脚本（与 P0/P2 门禁同源）：文档/编号/语义命名/需求追溯等一致性。
    # 阻塞型（无 continue-on-error）——这些漂移必须当场修掉，否则会像“财报域备源静默失效”
    # 那样拖到线上才被发现。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install --retries 5 --timeout 60 -e ".[test]"

      - name: 代码历史痕迹 + 任务编号标识符（check-code-traces）
        run: python scripts/check-code-traces.py --ci

      - name: 文档历史痕迹（check-doc-traces）
        run: python scripts/check-doc-traces.py --ci

      - name: 任务编号全局一致性（check-task-numbering）
        run: python scripts/check-task-numbering.py --ci

      - name: 语义命名索引正反向（check-semantic-index）
        run: python scripts/check-semantic-index.py --ci

      - name: 文档与实现一致性（check-doc-drift）
        run: python scripts/check-doc-drift.py --ci

      - name: 测试用例冗余与无效（check-test-redundancy）
        run: python scripts/check-test-redundancy.py --ci

      - name: 需求 ID 追溯（check-requirement-trace）
        run: python scripts/check-requirement-trace.py --ci

  portability:
    # 非 UTF-8 locale / 隐式编码门禁（阻塞）。test / format / guards 三个 job 全在 UTF-8 locale
    # 上跑，以下两类缺陷在它们上面结构性不可见（中文 Windows cp936 用户首启即装不上依赖）：
    #   ① 未显式 encoding= 的文本 I/O（在 cp936 上静默写成 GBK、读回时乱码或报错）
    #   ② 旧 pip（≤24.x）对含非 ASCII 的需求文件回退 locale 解码
    # 两道探针都可在任意平台本地复现（见 developer-guide.md「编码/locale 自检」），
    # 不依赖安装 GB18030 locale、也不依赖 Windows runner（GitHub 的 Windows runner 是 en-US
    # cp1252，单字节不会报错，挡不住 GBK 类 locale 回退）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install --retries 5 --timeout 60 -e ".[test]"

      # ① PEP 597 隐式编码严格档：任何未显式 encoding= 的文本 I/O 立即失败（豁免项在 pytest.ini 声明）。
      #    放在 pip 降级之前，避免「环境已被改过」影响判定；失败详情以 workflow annotation 回传
      #    （Annotations / checks API 可免授权读到具体用例名，无须日志下载权限）。
      - name: 隐式编码严格档 — 单元套件
        run: |
          set +e
          PYTHONWARNDEFAULTENCODING=1 python -m pytest src/test/unit -q --tb=short > /tmp/strict-encoding.log 2>&1
          rc=$?
          tail -40 /tmp/strict-encoding.log
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' /tmp/strict-encoding.log | head -15 | while IFS= read -r line; do
              echo "::error title=隐式编码严格档::$line"
            done
          fi
          exit "$rc"

      # ② 固定装回 pip==24.3.1（最后一版仍按「BOM → PEP263 cookie → locale 编码」解码需求文件），
      #    在 LC_ALL=C 下真实解析 requirements.txt。LC_ALL=C 是同类 locale 回退的最严档：
      #    ASCII 单字节，任何非 ASCII 字节必炸（cp936 是「偶尔能解码、必须报 0xac」的窄带）。
      - name: 旧 pip 在非 UTF-8 locale 下解析 requirements.txt
        run: |
          python -m pip install -q "pip==24.3.1"
          LC_ALL=C PYTHONCOERCECLOCALE=0 PYTHONUTF8=0 python -m pip install --dry-run --no-deps -r requirements.txt
