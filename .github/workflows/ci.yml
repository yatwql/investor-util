# CI/CD 流水线 — GitHub Actions
#
# 门禁等级（与 CLAUDE.md 一致）：
#   P0（提交前）→ dev-verify 模式 — dev 分支每次推送
#   P1（合入前）→ verify 模式   — master 分支 PR/推送
#   P2（发布前）→ regression 模式 — 版本标签推送（verify 由 P1 master 档覆盖）
#   guards      → 10 个 --ci 守护脚本（P0/P2 同源），阻塞；lint（ruff）非阻塞
#   portability → 非 UTF-8 locale + 隐式编码探针（PEP 597），阻塞

name: CI

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          # 不再自升级 pip（setup-python 自带版本足够新；冷自升级纯耗时且无缓存收益）
          pip install --retries 5 --timeout 60 -e ".[test]"

      - name: P0 — 快速验证（dev 提交门禁）
        if: github.ref_name == 'dev' && github.event_name == 'push'
        run: python scripts/test-runner.py --mode dev-verify --no-timeout

      - name: P1 — 合入验证（master 门禁）
        if: github.ref_name == 'master' || github.event_name == 'pull_request'
        run: python scripts/test-runner.py --mode verify --no-timeout

      - name: P2 — 发布验证（版本发布门禁）
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/test-runner.py --mode regression --no-timeout

      # 即使测试失败也上传报告，便于诊断失败测试（保留 7 天）
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: test-reports/latest/
          if-no-files-found: warn
          retention-days: 7

  format:
    runs-on: ubuntu-latest
    continue-on-error: true  # lint/格式问题不阻断 CI（非阻塞门禁，可后续修复）
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          # 不再自升级 pip（setup-python 自带版本足够新；冷自升级纯耗时且无缓存收益）
          pip install --retries 5 --timeout 60 -e ".[test]"

      - name: Ruff 格式检查
        run: python -m ruff format --check src/python/ scripts/

      - name: Ruff Lint 检查
        run: python -m ruff check

  guards:
    # 十守护（与 P0/P2 门禁同源）：文档/编号/语义命名/需求追溯/版本号/文档链接等一致性。
    # 阻塞型（无 continue-on-error）——这些漂移必须当场修掉，否则会像“财报域备源静默失效”
    # 那样拖到线上才被发现。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          # 不再自升级 pip（setup-python 自带版本足够新；冷自升级纯耗时且无缓存收益）
          pip install --retries 5 --timeout 60 -e ".[test]"

      # 十守护后台并行回放（与 pre-commit 钩子执行体同款并发调度）：
      #   - 清单与 P0/P2 门禁五处同源（check-doc-drift 守护清单校验断言集合一致），
      #     CI 恒全量十守护、不按域条件化——本地降频不降级，CI 是全量兜底；
      #   - 任一守护非零退出 → 该守护输出折叠为 FAIL 分组并使 job 红；
      #   - editable 安装保留：守护经 src.python 链 import 项目运行时依赖
      #     （如 check-doc-drift → registry/tui_menu → httpx），无安装则无法运行。
      - name: 十守护并行（清单与 P0/P2 门禁同源，恒全量）
        run: |
          set +e
          GDIR="$RUNNER_TEMP/guards"
          mkdir -p "$GDIR"
          run_guard() {
            _n="$1"; shift
            ( python "$@" >"$GDIR/$_n.log" 2>&1; echo $? >"$GDIR/$_n.rc" ) &
          }
          run_guard code-traces scripts/check-code-traces.py --ci
          run_guard doc-traces scripts/check-doc-traces.py --ci
          run_guard task-numbering scripts/check-task-numbering.py --ci
          run_guard semantic-index scripts/check-semantic-index.py --ci
          run_guard doc-drift scripts/check-doc-drift.py --ci
          run_guard test-redundancy scripts/check-test-redundancy.py --ci
          run_guard requirement-trace scripts/check-requirement-trace.py --ci
          run_guard version-consistency scripts/check-version-consistency.py --ci
          run_guard doc-links scripts/check-doc-links.py --ci
          run_guard file-length scripts/check-file-length.py --ci
          wait
          fail=0
          for n in code-traces doc-traces task-numbering semantic-index doc-drift \
                   test-redundancy requirement-trace version-consistency doc-links file-length; do
            rc="$(cat "$GDIR/$n.rc" 2>/dev/null || echo 1)"
            if [ "$rc" = "0" ]; then
              cat "$GDIR/$n.log"
            else
              echo "::group::[FAIL] $n (exit $rc)"
              cat "$GDIR/$n.log"
              echo "::endgroup::"
              fail=1
            fi
          done
          exit $fail

  portability:
    # 非 UTF-8 locale / 隐式编码门禁（阻塞）。test / format / guards 三个 job 全在 UTF-8 locale
    # 上跑，以下两类缺陷在它们上面结构性不可见（中文 Windows cp936 用户首启即装不上依赖）：
    #   ① 未显式 encoding= 的文本 I/O（在 cp936 上静默写成 GBK、读回时乱码或报错）
    #   ② 旧 pip（≤24.x）对含非 ASCII 的需求文件回退 locale 解码
    # 两道探针都可在任意平台本地复现（见 developer-guide.md「编码/locale 自检」），
    # 不依赖安装 GB18030 locale、也不依赖 Windows runner（GitHub 的 Windows runner 是 en-US
    # cp1252，单字节不会报错，挡不住 GBK 类 locale 回退）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          # akshare 在 Linux 上的依赖 py-mini-racer / jsonpath 只有 sdist（需源码构建 V8/纯 Python），
          # 下载/编译偶发失败会让整个 job 挂掉（实测 3.12 曾单独失败）——加下载重试与更长超时
          # 不再自升级 pip（setup-python 自带版本足够新；冷自升级纯耗时且无缓存收益）
          pip install --retries 5 --timeout 60 -e ".[test]"

      # ① PEP 597 隐式编码严格档：任何未显式 encoding= 的文本 I/O 立即失败（豁免项在 pytest.ini 声明）。
      #    放在 pip 降级之前，避免「环境已被改过」影响判定；失败详情以 workflow annotation 回传
      #    （Annotations / checks API 可免授权读到具体用例名，无须日志下载权限）。
      - name: 隐式编码严格档 — 单元套件
        run: |
          set +e
          PYTHONWARNDEFAULTENCODING=1 python -m pytest src/test/unit -q --tb=short > /tmp/strict-encoding.log 2>&1
          rc=$?
          tail -40 /tmp/strict-encoding.log
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' /tmp/strict-encoding.log | head -15 | while IFS= read -r line; do
              echo "::error title=隐式编码严格档::$line"
            done
          fi
          exit "$rc"

      # ② 固定装回 pip==24.3.1（最后一版仍按「BOM → PEP263 cookie → locale 编码」解码需求文件），
      #    在 LC_ALL=C 下真实解析 requirements.txt。LC_ALL=C 是同类 locale 回退的最严档：
      #    ASCII 单字节，任何非 ASCII 字节必炸（cp936 是「偶尔能解码、必须报 0xac」的窄带）。
      - name: 旧 pip 在非 UTF-8 locale 下解析 requirements.txt
        run: |
          python -m pip install -q "pip==24.3.1"
          LC_ALL=C PYTHONCOERCECLOCALE=0 PYTHONUTF8=0 python -m pip install --dry-run --no-deps -r requirements.txt
