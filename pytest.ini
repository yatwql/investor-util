[pytest]
testpaths = src/test
# 默认排除 live 真实网络套件（opt-in，`-m live` 或 `--run-live` 显式运行）
# 防止 all / dev-verify 等门禁误收集 live 用例触发真实网络调用
addopts = -m "not live"
# PEP 597 隐式编码严格档：以 PYTHONWARNDEFAULTENCODING=1 运行时（本地自检 / CI portability
# job），任何未显式 `encoding=` 的文本 I/O 立即失败——防「本机 UTF-8 locale 掩盖的 locale
# 回退解码」类缺陷（中文 Windows cp936 上会写/读出 GBK 内容或直接抛 UnicodeDecodeError）。
# 豁免：openpyxl 的 WorksheetWriter 内部 NamedTemporaryFile(mode='w+') 未传 encoding
# （上游行为：写入与读出共用同一 codec，zip 条目仍是 UTF-8，实测无用户可见影响）。
filterwarnings =
    error::EncodingWarning
    ignore::EncodingWarning:openpyxl.worksheet._writer
