[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-util"
version = "0.3.0"
description = "个人投资者辅助工具：读取持仓 Excel，生成 Excel/HTML 投资分析报告"
requires-python = ">=3.10"
dependencies = [
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "akshare==1.18.64",
    "lxml==6.1.1",
]

[project.optional-dependencies]
color = [
    "colorama==0.4.6",
]
test = [
    "pytest>=9.1",
    "pytest-mock>=3.15",
    "pytest-xdist>=3.6",
    "pytest-html>=4.2",
    "mypy>=1.15",
    "ruff>=0.11",
    "types-colorama",
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
required_plugins = ["pytest-mock==3.15.1", "pytest-xdist>=3.6"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "SIM", "UP", "ARG", "PERF"]

[tool.ruff.lint.per-file-ignores]
"src/test/*" = ["ARG"]
"src/python/*" = ["E402", "E501", "E701", "E702"]
"src/python/handlers_cache.py" = ["F541"]
"src/python/tui_menu.py" = ["F541"]

[tool.mypy]
python_version = "3.10"
strict = false
no_implicit_optional = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [".venv"]
