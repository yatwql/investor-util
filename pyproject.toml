[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "investor-util"
version = "0.2.83"
description = "个人投资者辅助工具：读取持仓 Excel，生成 Excel/HTML 投资分析报告"
requires-python = ">=3.10"
dependencies = [
    "colorama==0.4.6",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "akshare==1.18.64",
    "lxml==6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
required_plugins = ["pytest-mock==3.15.1", "pytest-xdist>=3.6"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = [".venv"]
