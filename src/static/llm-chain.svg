<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="100%" role="img" aria-label="LLM 智囊团多 Provider 链式分发流程：触发源经缓存指纹判定后进入 Provider Chain，按策略递补，输出六类深度分析">
  <title>LLM 智囊团多 Provider 链式分发图</title>
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16283f"/>
    </linearGradient>
    <linearGradient id="engGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183a5e"/>
      <stop offset="1" stop-color="#122c4a"/>
    </linearGradient>
    <marker id="arrowCyan2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowDown2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,10 L10,0 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  </style>

  <!-- 背景 -->
  <rect x="0" y="0" width="1000" height="530" rx="18" fill="url(#bgGrad2)"/>

  <!-- 标题区 -->
  <text x="500" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#e8f1fb">LLM 智囊团 · 多 Provider 链式分发</text>
  <text x="500" y="80" text-anchor="middle" font-size="15" fill="#9fb6d0">持仓变更 → 指纹失效 → 链式递补 → 深度复盘</text>

  <!-- 顶部行：触发源 + 缓存指纹判定 -->
  <rect x="40" y="104" width="300" height="72" rx="12" fill="#1d3557" stroke="#2e4a6e"/>
  <text x="62" y="134" font-size="15" font-weight="700" fill="#22d3ee">触发源</text>
  <text x="62" y="158" font-size="13" fill="#9fb6d0">持仓变更 · 报告生成 · 手动刷新</text>
  <line x1="344" y1="140" x2="382" y2="140" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowCyan2)"/>
  <rect x="390" y="104" width="300" height="72" rx="12" fill="#1d3557" stroke="#2e4a6e"/>
  <text x="412" y="134" font-size="15" font-weight="700" fill="#34d399">缓存指纹判定</text>
  <text x="412" y="158" font-size="13" fill="#9fb6d0">命中直接返回 · 持仓变更自动失效</text>

  <!-- 顶部→中部 箭头 -->
  <line x1="540" y1="180" x2="540" y2="190" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowDown2)"/>

  <!-- Provider Chain 大卡 -->
  <rect x="40" y="196" width="920" height="164" rx="16" fill="url(#engGrad2)" stroke="#2f5d8a"/>
  <text x="500" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#22d3ee">Provider Chain 链式分发</text>
  <text x="500" y="248" text-anchor="middle" font-size="13" fill="#9fb6d0">任一 Provider 失败 → 自动递补下一个</text>

  <!-- 4 个 Provider 卡 -->
  <rect x="40" y="262" width="168" height="74" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="56" y="302" font-size="22">🤖</text>
  <text x="84" y="294" font-size="16" font-weight="700" fill="#e8f1fb">Claude</text>
  <text x="84" y="316" font-size="11" fill="#9fb6d0">Anthropic 系列</text>

  <rect x="228" y="262" width="168" height="74" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="244" y="302" font-size="22">🟢</text>
  <text x="272" y="294" font-size="16" font-weight="700" fill="#e8f1fb">OpenAI</text>
  <text x="272" y="316" font-size="11" fill="#9fb6d0">GPT 系列</text>

  <rect x="416" y="262" width="168" height="74" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="432" y="302" font-size="22">🐋</text>
  <text x="460" y="294" font-size="16" font-weight="700" fill="#e8f1fb">DeepSeek</text>
  <text x="460" y="316" font-size="11" fill="#9fb6d0">DeepSeek 系列</text>

  <rect x="604" y="262" width="168" height="74" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="620" y="302" font-size="22">🌙</text>
  <text x="648" y="294" font-size="16" font-weight="700" fill="#e8f1fb">Kimi</text>
  <text x="648" y="316" font-size="11" fill="#9fb6d0">月之暗面 · 长文本</text>

  <rect x="792" y="262" width="168" height="74" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="808" y="302" font-size="22">✨</text>
  <text x="836" y="294" font-size="16" font-weight="700" fill="#e8f1fb">Gemini</text>
  <text x="836" y="316" font-size="11" fill="#9fb6d0">Google · 2.5 系列</text>

  <!-- 卡间链式小箭头 -->
  <line x1="208" y1="299" x2="224" y2="299" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan2)"/>
  <line x1="396" y1="299" x2="412" y2="299" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan2)"/>
  <line x1="584" y1="299" x2="600" y2="299" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan2)"/>
  <line x1="772" y1="299" x2="788" y2="299" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan2)"/>

  <!-- 中部→策略 箭头 -->
  <line x1="500" y1="364" x2="500" y2="374" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowDown2)"/>

  <!-- 策略行：4 个 pill -->
  <rect x="52" y="380" width="215" height="46" rx="23" fill="#1d3557" stroke="#2e4a6e"/>
  <text x="160" y="401" text-anchor="middle" font-size="15" font-weight="700" fill="#e8f1fb">顺序递补</text>
  <text x="160" y="418" text-anchor="middle" font-size="11" fill="#6b87a5">priority</text>

  <rect x="279" y="380" width="215" height="46" rx="23" fill="#1d3557" stroke="#2e4a6e"/>
  <text x="387" y="401" text-anchor="middle" font-size="15" font-weight="700" fill="#e8f1fb">加权随机</text>
  <text x="387" y="418" text-anchor="middle" font-size="11" fill="#6b87a5">weighted</text>

  <rect x="506" y="380" width="215" height="46" rx="23" fill="#1d3557" stroke="#2e4a6e"/>
  <text x="614" y="401" text-anchor="middle" font-size="15" font-weight="700" fill="#e8f1fb">低成本优先</text>
  <text x="614" y="418" text-anchor="middle" font-size="11" fill="#6b87a5">cost_first</text>

  <rect x="733" y="380" width="215" height="46" rx="23" fill="#1d3557" stroke="#2e4a6e"/>
  <text x="841" y="401" text-anchor="middle" font-size="15" font-weight="700" fill="#e8f1fb">仅故障降级</text>
  <text x="841" y="418" text-anchor="middle" font-size="11" fill="#6b87a5">fallback_only</text>

  <!-- 策略→输出 箭头 -->
  <line x1="500" y1="430" x2="500" y2="440" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowDown2)"/>

  <!-- 输出行：4 个模块 -->
  <rect x="30" y="446" width="140" height="46" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="42" y="476" font-size="16">🌍</text>
  <text x="66" y="476" font-size="12" fill="#e8f1fb">全球政经局势</text>

  <rect x="190" y="446" width="140" height="46" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="202" y="476" font-size="16">🧠</text>
  <text x="226" y="476" font-size="12" fill="#e8f1fb">智囊团复盘</text>

  <rect x="350" y="446" width="140" height="46" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="362" y="476" font-size="16">📰</text>
  <text x="386" y="476" font-size="12" fill="#e8f1fb">新闻关联分析</text>

  <rect x="510" y="446" width="140" height="46" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="522" y="476" font-size="16">🩺</text>
  <text x="546" y="476" font-size="12" fill="#e8f1fb">持仓体检报告</text>

  <rect x="670" y="446" width="140" height="46" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="682" y="476" font-size="16">🔍</text>
  <text x="706" y="476" font-size="12" fill="#e8f1fb">穿透深度分析</text>

  <rect x="830" y="446" width="140" height="46" rx="12" fill="#20375a" stroke="#33608c"/>
  <text x="842" y="476" font-size="16">🪞</text>
  <text x="866" y="476" font-size="12" fill="#e8f1fb">生成后自检</text>

  <!-- 底部脚注 -->
  <text x="500" y="516" text-anchor="middle" font-size="12" fill="#6b87a5">Extended Thinking 扩展思考：Claude / DeepSeek / Kimi / Gemini 2.5 按模块独立开启</text>
</svg>
